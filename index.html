<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expression Tree Generator</title>
    <!--start favicon meta deta-->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="theme-color" content="#ffffff">
    <!--end favicon metadata-->
    <!-- MathJax -->
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="./src/app.css">
</head>

<body>

    <div class="contact-section">
        <div class="inner-width">
            <h1>Expression Tree Generator</h1>
            <div class="inner-input-container" style="text-align: left;">
                <span>Current Expression:</span>
                <input type="text" class="name" id='expression-input' placeholder="e.g (x + y)*z - (t / w)">
            </div>

            <div class="buttons">
                <button id="generate-tree">Generate (old)</button>
                <button id="generate-nary-tree">Generate (nary)</button>
                <button id="clear-tree">Clear</button>
            </div>
            <div class="buttons">
                <button id="randomize">Randomize Expression</button>
                <button id="canonicalize">Canonicalize Expression</button>
            </div>
        </div>
    </div>
    <div class="math-display-container">
        <div id="math-display">
            $$  1/2 $$
        </div>
    </div>
    <div id="canvas-container">
        <canvas></canvas>
    </div>

    <a class="github-link" href="https://github.com/lnogueir/expression-tree-gen">
        <img src="GitHub_Logo.png" />
    </a>
    When \(a \ne 0\), there are two solutions to \(ax^2 + bx + c = 0\) and they are
$$x = {-b \pm \sqrt{b^2-4ac} \over 2a}.$$
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/6.6.1/math.min.js"></script>
<script type="module" src="./src/main.ts"></script>

</html>
